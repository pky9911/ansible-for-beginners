---
- name: this is to install web servers
  hosts: all
  vars:
    httpd_port: 8081
    apache2_port: 8080

  tasks:
  - name: install httpd
    ansible.builtin.dnf:
      name: httpd
      state: present
    when: ansible_facts["os_family"]  == "RedHat"
    notify:
    - start httpd service
    - create httpd html file
      
  - name: install apache
    ansible.builtin.apt:
      name: apache2
      state: present
    when:  ansible_facts["os_family"] == "Debian"
    notify: 
    - start apache2 service
    - create apache2 html file

  - name: Ensure the default httpd  port is {{httpd_port}}
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^Listen '
      insertafter: '^#Listen '
      line: Listen 8081
    when: ansible_facts["os_family"]  == "RedHat"
    notify:
    - restart httpd

  - name: Ensure the default Apache port is {{apache2_port}}
    ansible.builtin.lineinfile:
      path: /etc/apache2/ports.conf
      regexp: '^Listen '
      insertafter: '# /etc/apache2/sites-enabled/000-default.conf'
      line: Listen 8080
    when: ansible_facts["os_family"]  == "Debian"
    notify:
    - restart apache2

  handlers:
  - name: start httpd service
    ansible.builtin.service:
      name: httpd
      state: started

  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: reloaded
  
  - name: start apache2 service
    ansible.builtin.service:
      name: apache2
      state: started

  - name: restart apache2
    ansible.builtin.service:
       name: apache2
       state: reloaded


  - name: create httpd html file
    ansible.builtin.copy:
      content: |
        line1: this is httpd server running
        line2: all good!
      dest: /var/www/html/index.html
      mode: '0644'

  - name: create apache2 html file
    ansible.builtin.copy:
      content: |
        line1: this is apache2 server running
        line2: all good!
      dest: /var/www/html/index.html
      mode: '0644'

